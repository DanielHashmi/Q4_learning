name: Project 11 - Routine B Executor

on:
  workflow_dispatch:
    inputs:
      draft_branch:
        description: "The reviewed claude/* draft branch"
        required: true
        type: string
      draft_run_id:
        description: "Routine A run ID that created the draft"
        required: true
        type: string
      approval_note:
        description: "Human approval note; not copied to the transcript"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.draft_branch }}
      - name: Validate approval boundary and perform one follow-up
        env:
          PROJECT11_B_BEARER_TOKEN: ${{ secrets.PROJECT11_B_BEARER_TOKEN }}
        run: |
          test -n "$PROJECT11_B_BEARER_TOKEN"
          bash loop-engineering/projects/11-two-routine-gate/run-b.sh \
            "${{ inputs.draft_branch }}" "${{ inputs.draft_run_id }}" \
            "${{ inputs.approval_note }}" loop-engineering/projects/11-two-routine-gate
          git config user.name 'project-11-routine-b[bot]'
          git config user.email 'project-11-routine-b[bot]@users.noreply.github.com'
          git add loop-engineering/projects/11-two-routine-gate/follow-up-complete.md loop-engineering/projects/11-two-routine-gate/progress.md loop-engineering/projects/11-two-routine-gate/transcript-b.txt
          git commit -m "chore: record approved Project 11 follow-up"
          git push
      - name: Record executor action on draft PR
        env:
          GH_TOKEN: ${{ secrets.PROJECT11_B_BEARER_TOKEN }}
        run: |
          pr_url=$(gh pr list --head "${{ inputs.draft_branch }}" --json url --jq '.[0].url')
          test -n "$pr_url"
          gh pr comment "$pr_url" --body "Routine B executed after explicit human approval. Follow-up record committed; no merge or deploy was performed."
      - name: Upload Routine B transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-11-routine-b-${{ github.run_id }}
          path: loop-engineering/projects/11-two-routine-gate/transcript-b.txt
