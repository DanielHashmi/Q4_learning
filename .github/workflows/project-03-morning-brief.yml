name: Project 3 - Morning TODO Brief

on:
  schedule:
    # 09:00 Asia/Karachi, Monday through Friday.
    - cron: "0 9 * * 1-5"
      timezone: "Asia/Karachi"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-03-morning-brief
  cancel-in-progress: false

jobs:
  scan-todos:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the latest spine
        uses: actions/checkout@v6

      - name: Install OpenCode
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Update the TODO spine with OpenCode
        shell: bash
        working-directory: loop-engineering/projects/03-unattended-schedule
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --model opencode/big-pickle --auto "$(cat <<'PROMPT'
          You maintain this morning TODO brief.

          1. Read progress.md before doing anything else.
          2. Scan only task.js and utils.ts for TODO comments.
          3. Treat a TODO as already recorded only when its exact
             '- filename:line - TODO: description' entry is already in progress.md.
          4. Append one dated section to progress.md. Add only TODOs not already
             recorded. If there are none, write exactly 'No new TODOs found.'
          5. Do not modify task.js or utils.ts. Do not modify any file outside progress.md.
          6. Report the total TODOs scanned, new TODOs, and previously recorded TODOs.
          PROMPT
          )"

      - name: Commit the updated spine
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"
          if [ -n "$changed_files" ] && [ "$changed_files" != "loop-engineering/projects/03-unattended-schedule/progress.md" ]; then
            echo "OpenCode changed files outside the allowed spine:"
            echo "$changed_files"
            exit 1
          fi

          if git diff --quiet -- loop-engineering/projects/03-unattended-schedule/progress.md; then
            echo "OpenCode made no spine changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loop-engineering/projects/03-unattended-schedule/progress.md
          git commit -m "chore(project-03): update morning TODO brief"
          git push origin HEAD:main
