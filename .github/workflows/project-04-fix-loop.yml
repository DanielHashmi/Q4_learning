name: Project 4 - Safe Fix Loop

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Candidate proof to run
        required: true
        type: choice
        options:
          - both
          - good
          - bad
        default: both

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Project 4 orchestration
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bash loop-engineering/projects/04-fix-loop/scripts/run-fix-loop.sh --scenario ${{ inputs.scenario }}

      - name: Upload Project 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-04-fix-loop-${{ github.run_id }}
          path: loop-engineering/projects/04-fix-loop/artifacts/
          if-no-files-found: warn